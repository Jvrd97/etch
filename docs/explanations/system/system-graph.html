// отрисовка
const elE=edges.map(e=>{const l=document.createElementNS(NS,'line');l.setAttribute('class','edge '+e.via);gE.appendChild(l);
  const t=document.createElementNS(NS,'text');t.setAttribute('class','edge-label');t.setAttribute('text-anchor','middle');t.textContent=e.label||e.via;gL.appendChild(t);e.el=l;e.tl=t;return l;});
const elN=nodes.map(n=>{const g=document.createElementNS(NS,'g');g.setAttribute('class','node '+n.kind);
  const shape=document.createElementNS(NS,n.kind==='external'?'ellipse':'rect');
  if(n.kind==='external'){shape.setAttribute('rx',bw(n)/2);shape.setAttribute('ry',bh/2);}else{shape.setAttribute('width',bw(n));shape.setAttribute('height',bh);}
  const t=document.createElementNS(NS,'text');t.setAttribute('text-anchor','middle');t.textContent=n.label;
  const s=document.createElementNS(NS,'text');s.setAttribute('class','sub');s.setAttribute('text-anchor','middle');s.textContent=(n.note||'').slice(0,28);
  g.append(shape,t,s);gN.appendChild(g);n.el=g;
  g.addEventListener('click',ev=>{ev.stopPropagation();select(n);});
  let drag=null;g.addEventListener('pointerdown',ev=>{const q=pt(ev);drag={dx:n.x-q.x,dy:n.y-q.y};n.fixed=true;g.setPointerCapture(ev.pointerId);});
  g.addEventListener('pointermove',ev=>{if(!drag)return;const q=pt(ev);n.x=q.x+drag.dx;n.y=q.y+drag.dy;draw();});
  g.addEventListener('pointerup',()=>{drag=null;});
  return g;});
function draw(){
  for(const e of edges){const l=e.el;const dx=e.t.x-e.s.x,dy=e.t.y-e.s.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const sx=e.s.x+dx/d*bw(e.s)/2*.9, sy=e.s.y+dy/d*bh/2*.9, tx=e.t.x-dx/d*bw(e.t)/2*1.05, ty=e.t.y-dy/d*bh/2*1.05;
    l.setAttribute('x1',sx);l.setAttribute('y1',sy);l.setAttribute('x2',tx);l.setAttribute('y2',ty);
    e.tl.setAttribute('x',(sx+tx)/2);e.tl.setAttribute('y',(sy+ty)/2-4);}
  for(const n of nodes){const s=n.el.firstChild;
    if(n.kind==='external'){s.setAttribute('cx',n.x);s.setAttribute('cy',n.y);}else{s.setAttribute('x',n.x-bw(n)/2);s.setAttribute('y',n.y-bh/2);}
    n.el.children[1].setAttribute('x',n.x);n.el.children[1].setAttribute('y',n.y+(n.note?1:5));
    n.el.children[2].setAttribute('x',n.x);n.el.children[2].setAttribute('y',n.y+14);}
}
draw();
document.getElementById('nn').textContent=nodes.length;document.getElementById('ne').textContent=edges.length;

const panel=document.getElementById('panel');
function esc(s){return String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function select(n){
  nodes.forEach(m=>m.el.classList.remove('sel','dim'));edges.forEach(e=>{e.el.classList.remove('hot','dim');});
  if(!n){panel.innerHTML='<h2>Часть системы</h2><p>Выбери узел.</p>';return;}
  const near=new Set([n.id]);adj[n.id].forEach(e=>{near.add(e.from);near.add(e.to);});
  nodes.forEach(m=>{if(!near.has(m.id))m.el.classList.add('dim');});n.el.classList.add('sel');
  edges.forEach(e=>{if(e.from===n.id||e.to===n.id)e.el.classList.add('hot');else e.el.classList.add('dim');});
  const outs=adj[n.id].filter(e=>e.from===n.id), ins=adj[n.id].filter(e=>e.to===n.id);
  const li=e=>`<li><b>${esc(e.from===n.id?byId[e.to].label:byId[e.from].label)}</b> · ${esc(e.via)}${e.label?' · '+esc(e.label):''}${e.where?'<br><code>'+esc(e.where)+'</code>':''}</li>`;
  panel.innerHTML=`<div class="kind">${esc(n.kind)}</div><h2>${esc(n.label)}</h2>`+
    (n.path?`<p><code>${esc(n.path)}</code></p>`:'')+(n.note?`<p>${esc(n.note)}</p>`:'')+
    (outs.length?`<p><b>Вызывает / пишет</b></p><ul>${outs.map(li).join('')}</ul>`:'')+
    (ins.length?`<p><b>Кто обращается</b></p><ul>${ins.map(li).join('')}</ul>`:'')+
    (!outs.length&&!ins.length?'<p>Связей нет.</p>':'');
}
svg.addEventListener('click',()=>select(null));

// фильтры по типу связи
const vias=[...new Set(edges.map(e=>e.via))];
document.getElementById('filters').innerHTML=vias.map(v=>`<label><input type="checkbox" checked data-via="${v}"> ${v}</label>`).join('');
document.querySelectorAll('[data-via]').forEach(cb=>cb.addEventListener('change',()=>{
  edges.forEach(e=>{if(e.via===cb.dataset.via){e.el.style.display=cb.checked?'':'none';e.tl.style.display=cb.checked?'':'none';}});}));
window.addEventListener('resize',draw);
</script>
</html>
