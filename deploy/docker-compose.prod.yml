# [review:need-review] PHASE-03/106, PHASE-03/96, PHASE-03/108, PHASE-03/109
# summary: production override — restart policies, no host port for postgres, ENVIRONMENT=prod (empty API_KEY or "*" in CORS_ORIGINS kills the start), the backups directory mounted so the weekly md export lands on the host disk, and the single `worker` container that owns every background job, and SESSION_SECRET — empty kills the start the same way an empty API_KEY does
# Usage (on VPS, from habit-tracker/):
#   docker compose -f docker-compose.yml -f ../deploy/docker-compose.prod.yml up -d --build
services:
  postgres:
    restart: always
    ports: []  # DB is reachable only from the compose network

  backend:
    restart: always
    # --timeout must stay above LLM_TIMEOUT_SECONDS (120s in app/llm/client.py):
    # a month-long insights report is one long synchronous request, and a
    # shorter worker timeout would kill it before the CLI returns.
    command: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --max-requests 1000 --max-requests-jitter 50 --graceful-timeout 30 --timeout 180 --access-logfile - --error-logfile -
    environment:
      # prod is the switch that turns dev conveniences into a startup failure:
      # an empty API_KEY or a "*" in CORS_ORIGINS and the container dies with a
      # message naming the variable (app/core/config.py).
      ENVIRONMENT: prod
      API_KEY: ${API_KEY:-}
      # Signing key of the browser session (PHASE-03/109). Empty and the
      # container dies with a message naming the variable, exactly like an empty
      # API_KEY: a publicly known signing key means a forgeable session cookie.
      # Changing it logs every browser out at once — that is the whole revocation
      # story, and it is on purpose (no session table exists).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Lifetime of that cookie, seconds. Default 30 days.
      SESSION_MAX_AGE_S: ${SESSION_MAX_AGE_S:-2592000}
      # `Secure` on the session cookie, on by default. Serving the frontend over
      # plain http (a tailnet address without a certificate, ADR-0003) means the
      # browser stores no Secure cookie at all — set this to false there, and
      # know that the tailnet is then the only thing encrypting the transport.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Browser origins allowed to call the API, comma-separated, no JSON:
      #   CORS_ORIGINS=http://habit.tailnet:3000
      # Empty is a valid answer and the safest default — the Next.js frontend
      # proxies /api/v1 server-side (API_PROXY_TARGET), so the browser never
      # makes a cross-origin call. Fill it in only for a client that does.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_BACKEND: ${LLM_BACKEND:-cli}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    # The claude CLI login has to come from the host: the binary is baked
    # into the image, the credentials never are. Note that compose merges
    # volume lists by target, so the base file's /app bind mount stays —
    # an empty list here never removed it.
    volumes:
      - ${CLAUDE_CONFIG_DIR:-${HOME}/.claude}:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
      # The weekly `.md` export (deploy/export-md.sh) runs inside this container
      # and writes to /backups/exports; the host reads the same bytes under
      # BACKUP_DIR/exports. Without this mount the export lands in a container
      # layer and dies with the next `up --build`.
      - ${BACKUP_DIR:-/opt/habit-tracker/backups}:/backups

  # The one background scheduler (PHASE-03/108). `replicas: 1` is written out
  # rather than left to the default: two instances would poll the same source
  # twice, and the advisory lock inside each job is the belt, not the braces.
  worker:
    restart: always
    command: python -m app.worker
    deploy:
      replicas: 1
    environment:
      # The same perimeter as the backend: a prod container refuses to start on
      # an empty API_KEY, and this one shares the image and the settings module.
      ENVIRONMENT: prod
      API_KEY: ${API_KEY:-}
      # Same settings module, same refusal: without SESSION_SECRET this
      # container does not start either, even though it serves no browser.
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_BACKEND: ${LLM_BACKEND:-cli}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    volumes:
      - ${CLAUDE_CONFIG_DIR:-${HOME}/.claude}:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json

  frontend:
    restart: always
    profiles: ["web"]  # optional: enable with --profile web
