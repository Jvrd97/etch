# [review:need-review] PHASE-03/106, PHASE-03/96, PHASE-03/108, PHASE-03/109, PHASE-03/188
# summary: production override — restart policies, no host port for postgres, ENVIRONMENT=prod (empty API_KEY or "*" in CORS_ORIGINS kills the start), the backups directory mounted so the weekly md export lands on the host disk, and the single `worker` container that owns every background job, and SESSION_SECRET — empty kills the start the same way an empty API_KEY does; plus the two things that make a deploy provable — every dev mount dropped, and the deployed commit stamped on each image
# summary: PHASE-03/188 binds every published port to BIND_ADDR (the host's Tailscale address, default 127.0.0.1) and actually unpublishes postgres with `!reset` — the empty list it carried before merged into the base mapping and left the database open on the public IP
# Usage (on VPS, from habit-tracker/): `make up` — it exports the GIT_SHA this file
# needs and runs deploy/verify-deploy.sh afterwards. The raw command underneath is
#   docker compose --profile web -f docker-compose.yml -f ../deploy/docker-compose.prod.yml up -d --build
# but run bare it labels the images `revision: unset` and the verification fails.
#
# ─── Why every service below drops its volumes ───────────────────────────────
# docker-compose.yml is the *development* file. Its mounts exist so an edit on
# the laptop reaches a running container without a rebuild:
#
#   backend/worker:  ./services/backend:/app        (host source over image code)
#   frontend:        ./services/frontend:/app       (host source over image code)
#                    /app/node_modules              (anonymous volume)
#                    /app/.next                     (anonymous volume)
#
# In production every one of these is a lie detector switched off:
#
# 1. The two anonymous volumes are the bug that shipped. Docker creates such a
#    volume on the container's FIRST start, seeded from the image, and then
#    reuses the SAME volume forever — it is never re-seeded. From the second
#    start on, the volume mounted at /app/.next hides the freshly built .next
#    that lives in the image underneath it. The image had a current
#    .next/BUILD_ID; the container served the month-old build out of the volume.
#    `up --build` and even `build --no-cache` do not help: they rebuild the
#    image, and the image is not what is being served. Only `down -v` /
#    `docker volume rm` clears it. This override removes the mounts instead, so
#    /app/.next is the image's directory again and every deploy is visible.
# 2. The bind mounts of ./services/* over /app make prod run the host working
#    tree rather than the artefact that was built, reviewed and could be rolled
#    back. Then the image is decoration: a half-finished edit or a stray file on
#    the VPS is what actually serves traffic. Prod runs the image, full stop.
#
# Compose merges `volumes:` by target path, so a shorter list here would NOT
# have removed anything — that is exactly how the /app mounts survived into
# production unnoticed. The `!reset` / `!override` tags below are what actually
# drop them (Compose Specification merge tags; `docker compose config` prints
# the result, and an empty `volumes` there is the proof).
# ─── Why every published port is bound to an address ─────────────────────────
# `- "8000:8000"` in the base file publishes on 0.0.0.0, and docker writes its
# own iptables chain ahead of ufw's INPUT: a published port is reachable from
# the internet whether or not the host firewall says otherwise, and `ufw deny`
# on it changes nothing. On this server that meant the API without an API key,
# the whole interface and the database with the compose defaults
# (`habit_user`/`habit_pass`) answering on the public IP.
#
# So the address is part of the mapping. `BIND_ADDR` is the Tailscale IP of the
# host, and the default is `127.0.0.1` rather than the real one on purpose: a
# deploy that forgot the variable must end up unreachable, not public. Set it in
# `habit-tracker/.env` on the server:
#
#   BIND_ADDR=100.121.220.42
#
# `!override` is not decoration here. Compose merges `ports` by target port, so
# a shorter list — including the empty one this file used to carry for postgres
# — merges into the base list and removes nothing. That is exactly how the
# database stayed published on 0.0.0.0:5433 under a line claiming it was
# "reachable only from the compose network". Proof is the rendered config:
#
#   docker compose -f docker-compose.yml -f ../deploy/docker-compose.prod.yml \
#     --profile web config | grep -B2 -A6 published
services:
  postgres:
    restart: always
    # Not published at all: the backend and the worker reach it by service name
    # inside the compose network, and `make backup` runs inside the container.
    ports: !reset []

  backend:
    restart: always
    ports: !override
      - "${BIND_ADDR:-127.0.0.1}:8000:8000"
    # Stamp the deployed commit onto the image as an OCI label. The Dockerfile is
    # untouched: compose applies `build.labels` to the finished image itself.
    # deploy/verify-deploy.sh reads it back and compares with `git rev-parse HEAD`
    # on the host. GIT_SHA is exported by habit-tracker/Makefile; a hand-run
    # `docker compose build` without it leaves the literal "unset" and the
    # verification fails — an image nobody can date is an image nobody should
    # trust in production.
    build:
      context: ./services/backend
      labels:
        org.opencontainers.image.revision: ${GIT_SHA:-unset}
    # --timeout must stay above LLM_TIMEOUT_SECONDS (120s in app/llm/client.py):
    # a month-long insights report is one long synchronous request, and a
    # shorter worker timeout would kill it before the CLI returns.
    command: gunicorn app.main:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --max-requests 1000 --max-requests-jitter 50 --graceful-timeout 30 --timeout 180 --access-logfile - --error-logfile -
    environment:
      # prod is the switch that turns dev conveniences into a startup failure:
      # an empty API_KEY or a "*" in CORS_ORIGINS and the container dies with a
      # message naming the variable (app/core/config.py).
      ENVIRONMENT: prod
      API_KEY: ${API_KEY:-}
      # Signing key of the browser session (PHASE-03/109). Empty and the
      # container dies with a message naming the variable, exactly like an empty
      # API_KEY: a publicly known signing key means a forgeable session cookie.
      # Changing it logs every browser out at once — that is the whole revocation
      # story, and it is on purpose (no session table exists).
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Lifetime of that cookie, seconds. Default 30 days.
      SESSION_MAX_AGE_S: ${SESSION_MAX_AGE_S:-2592000}
      # `Secure` on the session cookie, on by default. Serving the frontend over
      # plain http (a tailnet address without a certificate, ADR-0003) means the
      # browser stores no Secure cookie at all — set this to false there, and
      # know that the tailnet is then the only thing encrypting the transport.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      # Browser origins allowed to call the API, comma-separated, no JSON:
      #   CORS_ORIGINS=http://habit.tailnet:3000
      # Empty is a valid answer and the safest default — the Next.js frontend
      # proxies /api/v1 server-side (API_PROXY_TARGET), so the browser never
      # makes a cross-origin call. Fill it in only for a client that does.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_BACKEND: ${LLM_BACKEND:-cli}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    # `!override` replaces the base list wholesale instead of merging into it,
    # which is what drops `./services/backend:/app`. Without it prod ran the host
    # working tree over the image's code (see the header). The venv already lives
    # outside /app (/opt/venv, see the Dockerfile) precisely because of that
    # mount, so removing it costs nothing.
    # The claude CLI login still has to come from the host: the binary is baked
    # into the image, the credentials never are.
    volumes: !override
      - ${CLAUDE_CONFIG_DIR:-${HOME}/.claude}:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json
      # The weekly `.md` export (deploy/export-md.sh) runs inside this container
      # and writes to /backups/exports; the host reads the same bytes under
      # BACKUP_DIR/exports. Without this mount the export lands in a container
      # layer and dies with the next `up --build`.
      - ${BACKUP_DIR:-/opt/habit-tracker/backups}:/backups

  # The one background scheduler (PHASE-03/108). `replicas: 1` is written out
  # rather than left to the default: two instances would poll the same source
  # twice, and the advisory lock inside each job is the belt, not the braces.
  worker:
    restart: always
    # Same image as the backend, same stamp — otherwise the scheduler could quietly
    # run a different build from the API it shares a database with.
    build:
      context: ./services/backend
      labels:
        org.opencontainers.image.revision: ${GIT_SHA:-unset}
    command: python -m app.worker
    deploy:
      replicas: 1
    environment:
      # The same perimeter as the backend: a prod container refuses to start on
      # an empty API_KEY, and this one shares the image and the settings module.
      ENVIRONMENT: prod
      API_KEY: ${API_KEY:-}
      # Same settings module, same refusal: without SESSION_SECRET this
      # container does not start either, even though it serves no browser.
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      LLM_BACKEND: ${LLM_BACKEND:-cli}
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
    # Same reason as the backend: `!override` drops ./services/backend:/app so the
    # scheduler runs image code, not whatever is lying in the checkout.
    volumes: !override
      - ${CLAUDE_CONFIG_DIR:-${HOME}/.claude}:/root/.claude
      - ${HOME}/.claude.json:/root/.claude.json

  frontend:
    restart: always
    profiles: ["web"]  # optional: enable with --profile web
    ports: !override
      - "${BIND_ADDR:-127.0.0.1}:3000:3000"
    build:
      context: ./services/frontend
      labels:
        org.opencontainers.image.revision: ${GIT_SHA:-unset}
    # THE BUG. The base file mounts three things here: the host source over /app,
    # and two anonymous volumes over /app/node_modules and /app/.next. The one at
    # /app/.next was created on the container's first start, seeded from the image
    # once, and reused unchanged from then on — covering the freshly built .next
    # inside the image. Result: the image carried a current .next/BUILD_ID while
    # the container served a month-old interface, and three `make deploy` runs in
    # a row reported success. Prod has no reason to own any of the three: nobody
    # edits source on the VPS, node_modules and .next come from the build.
    # `!reset` removes the key entirely (an empty list would only have merged and
    # changed nothing). Check with:
    #   docker compose -f docker-compose.yml -f ../deploy/docker-compose.prod.yml \
    #     --profile web config | grep -A5 'frontend:'
    # An already-poisoned server still needs the old volume destroyed once:
    #   docker compose ... down -v     (or: docker volume rm <the anonymous id>)
    # Config alone cannot delete a volume that already exists and is attached.
    volumes: !reset []
