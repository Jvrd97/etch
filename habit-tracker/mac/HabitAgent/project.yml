# [review:approved] PHASE-03/155
# summary: XcodeGen project for the menu bar agent and interval builder tests
name: HabitAgent
options:
  bundleIdPrefix: com.talvior
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HabitAgent:
    type: application
    platform: macOS
    sources:
      - HabitAgent
    info:
      path: HabitAgent/Info.plist
      properties:
        LSUIElement: true
  HabitAgentTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - HabitAgentTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HabitAgent
schemes:
  HabitAgent:
    build:
      targets:
        HabitAgent: all
    test:
      targets:
        - HabitAgentTests
