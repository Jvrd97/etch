# [review:need-review] PHASE-01/03-ios-scaffold-settings, PHASE-02/65
# summary: XcodeGen spec for the app, tests, and read-only HealthKit capability
name: HabitTracker
options:
  bundleIdPrefix: com.habittracker
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HabitTracker:
    type: application
    platform: iOS
    sources:
      - HabitTracker
    entitlements:
      path: HabitTracker/HabitTracker.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: HabitTracker/Info.plist
      properties:
        UILaunchScreen: {}
        NSHealthShareUsageDescription: Habit Tracker читает данные здоровья, чтобы показать ваши метрики.
        # Dev app talks to a local backend over plain HTTP (localhost / Tailscale IP).
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
  HabitTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - HabitTrackerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: HabitTracker
schemes:
  HabitTracker:
    build:
      targets:
        HabitTracker: all
    test:
      targets:
        - HabitTrackerTests
