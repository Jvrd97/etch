# [review:need-review] PHASE-01/13-backend-uv-mypy-ruff
# summary: uv-managed project config (deps from requirements.txt) + ruff/mypy strict settings
[project]
name = "habit-tracker-backend"
version = "1.0.0"
description = "Habit Tracker API backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    # sqlalchemy's own greenlet marker skips macOS arm64 -- declare it explicitly
    "greenlet>=3.0",
    "sqlalchemy==2.0.23",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    "alembic==1.12.1",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "python-dotenv==1.0.0",
    "python-multipart==0.0.6",
    "python-dateutil==2.8.2",
    # zoneinfo has no zone database of its own: without a system one it raises
    # ZoneInfoNotFoundError, and python:3.10-slim carries no guarantee of
    # shipping one. The single day boundary (app/core/daytime.py) must not
    # depend on what the base image happens to include
    "tzdata>=2024.1",
    "gunicorn>=26.0.0",
    "anthropic>=0.117.1",
    # The one background scheduler (app/worker.py, PHASE-03/108). 3.x, not the
    # 4.x pre-releases: 4.x rewrites the API and is not released as stable
    "apscheduler>=3.10,<4",
    "itsdangerous>=2.2",
    # frontmatter of `training/state.md` (`#92`); already in the tree via
    # uvicorn[standard], declared here because the import reads it directly
    "pyyaml>=6.0",
    # Контур входящих (`#97`) ходит в ClickUp по HTTP. До него клиента в проде
    # не было вообще — httpx стоял только в dev ради тестового транспорта.
    "httpx==0.25.2",
]

[dependency-groups]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "mypy>=1.10",
    "ruff>=0.4",
    "asyncpg-stubs>=0.29",
    "types-PyYAML>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
extend-exclude = ["alembic/versions"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

# APScheduler 3.x ships without a py.typed marker and has no stubs on typeshed.
# The alternative to this override is a `# type: ignore` on the import line of
# app/worker.py, which silences the same thing while saying less. The surface
# actually used is four calls wide (add_job/start/pause/shutdown) and lives in
# that one module.
[[tool.mypy.overrides]]
module = "apscheduler.*"
ignore_missing_imports = true
